[package]
name = "bw_core"
version = "0.1.1"
edition = "2024"

[features]
# Blocking HTTPS client for Rust hosts (Linux, CLI). Mobile and Windows apps
# perform requests through `BWHttpClient` instead.
native-http = ["dep:ureq"]

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
boltffi = { git = "https://github.com/boltffi/boltffi.git", rev = "d2c403db4db249c70586818f5bfd19018c979a38" }
chrono = "0.4.45"
uuid = { version = "1.23.5", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", optional = true }
