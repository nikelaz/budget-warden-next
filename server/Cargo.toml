[package]
name = "bw-cloud-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
bw_core = { path = "../core" }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
hmac = "0.12.1"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
sha2 = "0.10.9"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.7"
uuid = { version = "1.23.5", features = ["serde", "v4"] }
x509-parser = "0.18.1"
aws-lc-rs = "1.18"
