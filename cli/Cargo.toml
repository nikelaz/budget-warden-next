[package]
name = "bw_cli"
version = "0.1.1"
edition = "2024"
description = "Command-line client for Budget Warden budget files"
build = "build.rs"

[[bin]]
name = "budget-warden"
path = "src/main.rs"

[dependencies]
bw_core = { path = "../core" }
chrono = "0.4.45"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.23.5", features = ["v4", "serde"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
